<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <rect width="1024" height="600" fill="#090a0f" />
  <!-- Glass Hub Header -->
  <rect x="20" y="20" width="984" height="50" rx="16" fill="#14151f" stroke="#27272a" />
  <text x="40" y="50" fill="#f4f4f5" font-family="sans-serif" font-size="18" font-weight="bold">Avenly Eldercare Hub — 7-Inch Display</text>
  <text x="880" y="50" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">09:41 AM</text>
  
  <!-- Grid Widgets -->
  <!-- Vitals Widget -->
  <rect x="20" y="90" width="310" height="220" rx="20" fill="#12131a" stroke="#27272a" />
  <text x="40" y="125" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Vitals Overview</text>
  <text x="40" y="170" fill="#f4f4f5" font-family="monospace" font-size="28" font-weight="bold">72 BPM</text>
  <text x="40" y="195" fill="#a1a1aa" font-family="sans-serif" font-size="12">Heart Rate • Normal</text>
  <text x="40" y="240" fill="#f4f4f5" font-family="monospace" font-size="28" font-weight="bold">98% SpO2</text>
  <text x="40" y="265" fill="#a1a1aa" font-family="sans-serif" font-size="12">Blood Oxygen • Excellent</text>

  <!-- Medication Schedule Widget -->
  <rect x="350" y="90" width="320" height="220" rx="20" fill="#12131a" stroke="#27272a" />
  <text x="370" y="125" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold">Today's Medication Schedule</text>
  <rect x="370" y="145" width="280" height="50" rx="12" fill="#1e1b4b" stroke="#4338ca" />
  <text x="385" y="175" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="bold">Metformin 500mg • 08:00 AM</text>
  <text x="600" y="175" fill="#34d399" font-family="monospace" font-size="11">TAKEN</text>
  <rect x="370" y="205" width="280" height="50" rx="12" fill="#18181b" stroke="#27272a" />
  <text x="385" y="235" fill="#e4e4e7" font-family="sans-serif" font-size="13" font-weight="bold">Atorvastatin 20mg • 08:00 PM</text>
  <text x="590" y="235" fill="#fbbf24" font-family="monospace" font-size="11">UPCOMING</text>

  <!-- Health Ring & Score -->
  <rect x="690" y="90" width="314" height="220" rx="20" fill="#12131a" stroke="#27272a" />
  <text x="710" y="125" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold">Overall Health Score</text>
  <circle cx="847" cy="200" r="50" fill="none" stroke="#27272a" stroke-width="10" />
  <circle cx="847" cy="200" r="50" fill="none" stroke="#f43f5e" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="30" />
  <text x="847" y="208" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">94</text>

  <!-- 5 Missing Widgets Row -->
  <rect x="20" y="330" width="180" height="150" rx="18" fill="#12131a" stroke="#27272a" />
  <text x="35" y="360" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold">Sleep Tracker</text>
  <text x="35" y="400" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">7.5 hrs</text>
  <text x="35" y="425" fill="#a1a1aa" font-family="sans-serif" font-size="11">Deep Sleep 2.1h</text>

  <rect x="220" y="330" width="180" height="150" rx="18" fill="#12131a" stroke="#27272a" />
  <text x="235" y="360" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Hydration</text>
  <text x="235" y="400" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">1,400 ml</text>
  <text x="235" y="425" fill="#a1a1aa" font-family="sans-serif" font-size="11">70% of 2,000ml</text>

  <rect x="420" y="330" width="180" height="150" rx="18" fill="#12131a" stroke="#27272a" />
  <text x="435" y="360" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="bold">Activity</text>
  <text x="435" y="400" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">3,850</text>
  <text x="435" y="425" fill="#a1a1aa" font-family="sans-serif" font-size="11">Steps Today</text>

  <rect x="620" y="330" width="180" height="150" rx="18" fill="#12131a" stroke="#27272a" />
  <text x="635" y="360" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">Mood Tracker</text>
  <text x="635" y="400" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Calm & Content</text>
  <text x="635" y="425" fill="#a1a1aa" font-family="sans-serif" font-size="11">Logged at 9:00 AM</text>

  <rect x="820" y="330" width="184" height="150" rx="18" fill="#12131a" stroke="#27272a" />
  <text x="835" y="360" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">Avenly Companion</text>
  <text x="835" y="400" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Active & Listening</text>
  <text x="835" y="425" fill="#34d399" font-family="monospace" font-size="11">Gemini 3.5 Ready</text>

  <!-- Bottom Navigation Bar -->
  <rect x="20" y="500" width="984" height="80" rx="24" fill="#12131a" stroke="#3f3f46" />
  <text x="120" y="545" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Home</text>
  <text x="240" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Health</text>
  <text x="360" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Calendar</text>
  <text x="480" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Chats</text>
  <text x="600" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Fun</text>
  <text x="720" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">AI Assistant</text>
  <text x="840" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Medication</text>
  <text x="940" y="545" fill="#a1a1aa" font-family="sans-serif" font-size="12" text-anchor="middle">Calls</text>
</svg>
