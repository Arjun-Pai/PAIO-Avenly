<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <rect width="1024" height="600" fill="#090a0f" />
  <rect x="20" y="20" width="984" height="560" rx="24" fill="#12131a" stroke="#27272a" />
  <text x="50" y="60" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Google Calendar Monthly Medical Appointments</text>
  
  <!-- Calendar Grid Header -->
  <rect x="50" y="90" width="924" height="40" rx="10" fill="#1e1b4b" stroke="#3730a3" />
  <text x="80" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Sun</text>
  <text x="210" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Mon</text>
  <text x="340" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Tue</text>
  <text x="470" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Wed</text>
  <text x="600" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Thu</text>
  <text x="730" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Fri</text>
  <text x="860" y="115" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="bold">Sat</text>

  <!-- Calendar Day Boxes -->
  <rect x="50" y="140" width="924" height="400" rx="16" fill="#18181b" stroke="#27272a" />
  <rect x="330" y="160" width="115" height="100" rx="12" fill="#312e81" stroke="#6366f1" />
  <text x="340" y="185" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">15 (Today)</text>
  <text x="340" y="210" fill="#a5b4fc" font-family="sans-serif" font-size="10">Dr. Sharma Call</text>

  <rect x="600" y="160" width="115" height="100" rx="12" fill="#064e3b" stroke="#10b981" />
  <text x="610" y="185" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">17</text>
  <text x="610" y="210" fill="#6ee7b7" font-family="sans-serif" font-size="10">Lab Checkup</text>
</svg>
